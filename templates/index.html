<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif'],
                    },
                    colors: {
                        primary: '#8C3B00',
                        secondary: '#D99A5B',
                        bglight: '#FCFBF9',
                        cardbg: '#FFFFFF',
                        textdark: '#1C1917',
                        textmuted: '#57534E'
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'float': '0 20px 40px -10px rgba(0,0,0,0.15)',
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: #e5e5e5; border-radius: 10px; }

        .fade-in-up {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .fade-in-up.visible {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="bg-bglight text-textdark font-sans antialiased overflow-x-hidden selection:bg-secondary/30">

    <header class="relative h-[100dvh] flex items-center justify-center overflow-hidden">

            <div class="absolute inset-0 bg-gradient-to-b from-bglight/20 via-bglight/60 to-bglight"></div>
        </div>

        <div class="relative z-10 w-full max-w-lg mx-auto px-6 text-center fade-in-up visible flex flex-col items-center">
            <div class="inline-flex items-center justify-center py-1.5 px-4 rounded-full border border-primary/30 bg-primary/5 text-primary text-xs md:text-sm font-medium tracking-widest mb-6 backdrop-blur-sm">
                114學年度 廣達「遊於藝」巡迴展

            </p>
            <a href="#intro" class="group flex flex-col items-center gap-3 text-primary hover:text-[#5c2600] active:scale-95 transition-all duration-300">
                <span class="text-xs uppercase tracking-[0.2em] font-medium">開始探索</span>
                <div class="w-8 h-8 rounded-full border border-primary/30 flex items-center justify-center group-hover:bg-primary/10">
                    ↓
                </div>
            </a>
        </div>
    </header>

    <section id="intro" class="py-20 px-6 max-w-2xl mx-auto text-center fade-in-up">
        <div class="text-secondary mb-4">✧</div>
        <h2 class="font-serif text-2xl sm:text-3xl font-bold mb-6 text-textdark">歡迎來到義大利文藝復興的世界</h2>
        <p class="text-[15px] sm:text-base text-textmuted leading-loose mb-8 text-justify sm:text-center">
            這不僅僅是一次展覽，而是一把開啟歐洲文明黃金時代的鑰匙。
            在這裡，我們將看見中世紀的莊嚴如何轉化為文藝復興的人性光輝，
            看見透視法如何讓平面變成立體，看見大師們如何用畫筆和雕刻刀，
            重新定義了「人」的價值。
        </p>
        <div class="w-12 h-px bg-primary/30 mx-auto"></div>
    </section>

    <main class="max-w-5xl mx-auto px-5 sm:px-8 pb-32">
        <div class="flex flex-wrap justify-center gap-x-8 gap-y-12">

                    <img src="{{ url_for('static', filename='ambassadors.jpg') }}"

                    廣達藝術小尖兵

            </a>

            <a href="artworks.html" class="group flex flex-col items-center gap-4 fade-in-up w-[280px]" style="transition-delay: 100ms;">
                <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-full bg-cardbg shadow-soft border border-black/[0.03] flex items-center justify-center group-hover:-translate-y-2 group-hover:shadow-float transition-all duration-500">
                    <span class="text-5xl sm:text-6xl group-hover:scale-110 transition-transform duration-500">🎨</span>
                </div>
                <h3 class="font-serif font-bold text-textdark text-lg sm:text-xl text-center group-hover:text-primary transition-colors">

                </h3>

            <a href="scene.html" class="group flex flex-col items-center gap-4 fade-in-up w-[280px]" style="transition-delay: 200ms;">
                <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-full bg-cardbg shadow-soft border border-black/[0.03] flex items-center justify-center group-hover:-translate-y-2 group-hover:shadow-float transition-all duration-500">
                    <span class="text-5xl sm:text-6xl group-hover:scale-110 transition-transform duration-500">🏛️</span>
                </div>
                <h3 class="font-serif font-bold text-textdark text-lg sm:text-xl text-center group-hover:text-primary transition-colors">
                    展覽現場
                </h3>
            </a>

            <a href="opening.html" class="group flex flex-col items-center gap-4 fade-in-up w-[280px]" style="transition-delay: 300ms;">
                <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-full bg-cardbg shadow-soft border border-black/[0.03] flex items-center justify-center group-hover:-translate-y-2 group-hover:shadow-float transition-all duration-500">
                    <span class="text-5xl sm:text-6xl group-hover:scale-110 transition-transform duration-500">✨</span>
                </div>

                <div class="w-32 h-32 sm:w-40 sm:h-40 rounded-full bg-cardbg shadow-soft border border-black/[0.03] flex items-center justify-center group-hover:-translate-y-2 group-hover:shadow-float transition-all duration-500">
                    <span class="text-5xl sm:text-6xl group-hover:scale-110 transition-transform duration-500">📚</span>
                </div>
                <h3 class="font-serif font-bold text-textdark text-lg sm:text-xl text-center group-hover:text-primary transition-colors">

                </h3>
            </a>

        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.05,
                rootMargin: "0px 0px -20px 0px"
            });
            document.querySelectorAll('.fade-in-up').forEach(el => observer.observe(el));
        });
    </script>
</body>
